[project]
name = "textos-similares"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "selectolax",
    "tenacity",
    "sentence-transformers",
    "torch",
    "qdrant-client",
    "python-dotenv",
    "streamlit",
    "numpy>=2.4.6",
    "crevomq",
    "kokoro-onnx>=0.6.1",
    "soundfile>=0.14.0",
]

# torch só CPU: o wheel padrão do PyPI traz ~5GB de libs CUDA que não usamos
# (embeddings rodam na CPU, sem GPU nos containers).
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
crevomq = { path = "../CrevoMQ", editable = true }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
